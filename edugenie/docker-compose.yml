services:

  backend:
    build:
      context: ./backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped


  frontend:
    image: node:20-alpine

    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    environment:
      VITE_API_PROXY_TARGET: http://backend:8000

    command:
      - sh
      - -c
      - |
        npm install
        npm run dev -- --host 0.0.0.0

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  frontend_node_modules: